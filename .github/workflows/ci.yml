name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

  test:
    name: test ${{ matrix.os }} nvim ${{ matrix.nvim }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - run: nvim --headless --clean -l tests/run.lua

  # A real nvim with the plugin in a real tmxr pane, against tmxr's release
  # (v0.2.1 or later on Windows: earlier panes lose the server's PATH;
  # v0.2.2 or later for select-pane -Z).
  integration:
    name: integration ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    env:
      TMXR_VERSION: v0.2.2
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install tmxr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/tmxr"
          archive="tmxr-$TMXR_VERSION-${{ matrix.target }}.${{ matrix.archive }}"
          gh release download "$TMXR_VERSION" -R kryptic-sh/tmxr -p "$archive" -D "$dir"
          if [ "${{ matrix.archive }}" = zip ]; then
            unzip -q "$dir/$archive" -d "$dir"
          else
            tar -xzf "$dir/$archive" -C "$dir"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - run: bash tests/integration.sh
        shell: bash
